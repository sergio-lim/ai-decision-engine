[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-decision-engine"
version = "1.0.0"
description = "Typed decision engine with a regex baseline and confidence router."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
include = ["decision_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
